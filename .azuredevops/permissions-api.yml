# Permissions API — deploy to api-permission-asdk-test-x16w
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/Saas.Identity/Saas.Permissions/Saas.Permissions.Service_v1.1/**
      - src/Saas.Lib/Saas.Identity/**
      - src/Saas.Lib/Saas.Shared/**
      - .azuredevops/permissions-api.yml
      - .azuredevops/templates/deploy-app.yml

variables:
  # Name of the ARM service connection (Workload Identity Federation) created in ADO.
  azureSubscription: 'asdk-azure'

extends:
  template: templates/deploy-app.yml
  parameters:
    webAppName: api-permission-asdk-test-x16w
    projectPath: src/Saas.Identity/Saas.Permissions/Saas.Permissions.Service_v1.1/Saas.Permissions.Service.csproj
    azureSubscription: $(azureSubscription)
    outputName: permissions-api
