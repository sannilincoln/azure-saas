# Sign-up Administration Web App — deploy to signupadmin-app-asdk-test-x16w
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/Saas.SignupAdministration/Saas.SignupAdministration.Web/**
      - src/Saas.Admin/Saas.Admin.Client/**
      - src/Saas.Lib/Saas.Identity/**
      - src/Saas.Lib/Saas.Shared/**
      - .azuredevops/signupadmin.yml
      - .azuredevops/templates/deploy-app.yml

variables:
  # Name of the ARM service connection (Workload Identity Federation) created in ADO.
  azureSubscription: 'asdk-azure'

extends:
  template: templates/deploy-app.yml
  parameters:
    webAppName: signupadmin-app-asdk-test-x16w
    projectPath: src/Saas.SignupAdministration/Saas.SignupAdministration.Web/Saas.SignupAdministration.Web.csproj
    azureSubscription: $(azureSubscription)
    outputName: signupadmin
